# config.yaml
github:
  token: "${GITHUB_TOKEN}"
  owner: "myorg"
  repo: "myrepo"
  base_url: "https://api.github.com"

teams:
  use_github_api: true
  teams_file: "teams.yaml"
  teams_dir: "teams/"

policy:
  policy_dir: "policies/"
  policy_files:
    - "policies/approval-policy.star"
    - "policies/file-policy.star"
  rules_file: "mushu.yaml"

logging:
  level: "info"
  format: "console"
